<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault Guardian</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<!--
THESIS: The game is a vault door with one tumbler per level; progress is the door turning, not a list of levels beside a chat app.
OWN-WORLD: Verdigris ground, patinated bronze rings, bone-white notches; ember only on the live tumbler and a ward that fired; Marcellus SC engraved caps over Alegreya Sans.
STORY: A visitor sees which tumbler glows, talks the guardian round within a counted number of breaths, and speaks the word into the hub.
FIRST VIEWPORT: Left 47%: the door at up to 640px with the password field in its hub, New game bottom left, progress legend bottom right. Right 53%: tumbler kicker, guardian name at 50px, wards, conversation, breath pips, composer.
FORM: Arcane vault door with rune tumblers, candidate 7 of 7, seed key a1932398.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="app">
<section class="door" aria-label="The vault door">
  <p class="wordmark">Vault Guardian</p>
  <a class="operator" href="/admin">Operator</a>
  <svg id="door" class="door-svg" viewBox="-320 -320 640 640" role="group" aria-label="Tumblers, one per level"></svg>
  <ol id="strip" class="strip" aria-label="Levels"></ol>
  <div class="door-foot">
    <button id="newGameBtn" class="btn btn-quiet seal" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 6.2A5.2 5.2 0 1 1 3 9.6"/><path d="M2.8 2.8v3.6h3.6"/></svg><span><span class="seal-long">Seal the vault · </span>new game</span></button>
    <p id="legend" class="legend"></p>
  </div>
</section>

<form id="guessForm" class="guess" autocomplete="off">
  <label for="guessInput">Speak the word</label>
  <input id="guessInput" name="guess" placeholder="· · · · · · · ·" spellcheck="false" disabled>
  <button id="guessBtn" class="guess-submit" type="submit" disabled>Turn the key</button>
  <p id="guessStatus" class="guess-status" aria-live="polite"></p>
</form>

<main class="hall">
  <p id="kicker" class="kicker"></p>
  <h1 id="guardian">The vault is waking</h1>
  <ul id="wards" class="wards"></ul>
  <p id="hint" class="hint"></p>
  <div id="log" class="log" aria-live="polite"></div>
  <div id="budget" class="budget" hidden>
    <span>Breaths left</span>
    <span id="pips" class="pips" aria-hidden="true"></span>
    <span id="budgetCount"></span>
  </div>
  <form id="composer" class="composer" autocomplete="off">
    <label class="sr-only" for="chatInput">Your message</label>
    <input id="chatInput" name="message" disabled>
    <button id="sendBtn" class="btn" type="submit" disabled>Speak</button>
  </form>
  <button id="forgetBtn" class="forget" type="button" disabled>Forget this conversation</button>
</main>
</div>
<script src="/app.js"></script>
</body>
</html>
